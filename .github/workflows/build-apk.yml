name: Build & Publish Ez Editorials APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          chmod -R +x node_modules/.bin

      - name: Bundle Web Assets to www/
        run: node build.js

      - name: Sync Web Assets with Capacitor
        run: |
          chmod -R +x node_modules/.bin
          npx cap sync android

      - name: Decode Release Keystore with Node.js
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          node -e "
            const fs = require('fs');
            const raw = process.env.KEYSTORE_BASE64 || '';
            // Strip out Windows UTF-16 null bytes, newlines, and non-base64 characters
            const clean = raw.replace(/[^A-Za-z0-9+/=]/g, '');
            const buffer = Buffer.from(clean, 'base64');
            if (buffer.length < 500) {
              console.error('Error: Decoded keystore is too small (' + buffer.length + ' bytes). Check KEYSTORE_BASE64 secret.');
              process.exit(1);
            }
            fs.writeFileSync('android/app/ezeditorials.keystore', buffer);
            console.log('✅ Keystore decoded successfully (' + buffer.length + ' bytes)');
          "
          ls -lh android/app/ezeditorials.keystore

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease
          cd ..

      - name: Sign & Align APK
        run: |
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          ALIGNED_APK="android/app/build/outputs/apk/release/EzEditorials-aligned.apk"
          FINAL_APK="android/app/build/outputs/apk/release/EzEditorials.apk"
          
          echo "Processing generated APK: $UNSIGNED_APK"
          
          # Align APK
          $BUILD_TOOLS_PATH/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          
          # Sign APK with your stored keystore
          $BUILD_TOOLS_PATH/apksigner sign \
            --ks android/app/ezeditorials.keystore \
            --ks-key-alias ezeditorials \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --out "$FINAL_APK" "$ALIGNED_APK"

          # Verify signature
          $BUILD_TOOLS_PATH/apksigner verify "$FINAL_APK"
          echo "✅ APK successfully signed and verified!"

      - name: Send APK to Telegram Topic 12916
        run: |
          curl --fail-with-body \
               -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F "message_thread_id=12916" \
               -F "document=@android/app/build/outputs/apk/release/EzEditorials.apk" \
               -F "caption=📘 <b>Ez Editorials for Android</b>%0A%0AInstall this release to study daily editorials, practice quizzes, and track rankings offline.%0A%0A⚡ <i>Tap the file above to download and install.</i>" \
               -F "parse_mode=HTML" \
               https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument
