name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore ezeditorials.keystore \
            -alias ezeditorials \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "EzEditorials2026" \
            -keypass "EzEditorials2026" \
            -dname "CN=Ez Editorials, OU=Education, O=Ez Editorials, C=IN"

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: ezeditorials.keystore