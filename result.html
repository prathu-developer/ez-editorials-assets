<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Results</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; color: #1a1a1a; }
        .header { text-align: center; margin-bottom: 24px; }
        .header h2 { margin: 0 0 4px 0; font-size: 24px; color: #1a1a1a; }
        .header p { margin: 0; color: #666; font-size: 14px; }
        .scorecard { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 32px; }
        .stat-box { background: #fff; padding: 16px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f0f0f0; }
        .stat-value { font-size: 22px; font-weight: 700; color: #5c3bfe; margin-bottom: 4px; }
        .stat-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-box.highlight { background: #5c3bfe; color: #fff; border: none; }
        .stat-box.highlight .stat-value { color: #fff; }
        .stat-box.highlight .stat-label { color: #e0e0e0; }
        h3 { font-size: 18px; margin-bottom: 16px; }
        .solution-card { background: #fff; padding: 16px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f0f0f0; }
        .question-text { font-size: 15px; font-weight: 600; margin-bottom: 16px; line-height: 1.5; white-space: pre-wrap; }
        .option { padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; background: #f8f9fa; border: 1px solid #eee; }
        .option.correct { background: #d4edda; border-color: #c3e6cb; color: #155724; font-weight: 600; }
        .option.wrong { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .explanation { margin-top: 16px; padding: 12px; background: #fff3cd; border-radius: 8px; font-size: 13px; line-height: 1.5; color: #856404; }
        
        /* 🟢 NEW ACTION BUTTONS */
        .action-row { display: flex; gap: 12px; margin-top: 24px; }
        .btn-share { flex: 1; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; background: #fff; color: #e73b50; border: 1px solid #e73b50; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-reattempt { flex: 1; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; background: #e73b50; color: #fff; border: none; cursor: pointer; }
        .btn-home { display: block; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; text-align: center; background: #1a1a1a; color: #fff; text-decoration: none; margin-top: 12px; box-sizing: border-box; }
        
        #loading { text-align: center; margin-top: 50px; color: #666; }
    </style>
</head>
<body>

    <div id="loading">Calculating Results...</div>

    <div id="result-content" style="display: none;">
        <div class="header">
            <h2 id="result-title">Quiz Complete!</h2>
            <p id="result-subtitle">Here is how you performed.</p>
        </div>

        <div class="scorecard" id="scorecard">
            <!-- Stats injected here -->
        </div>

        <h3>Detailed Solutions</h3>
        <div id="solutions-container">
            <!-- Solutions injected here -->
        </div>

        <div class="action-row">
            <button class="btn-share" onclick="shareResult()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                Share
            </button>
            <button class="btn-reattempt" onclick="triggerReattempt()">Re-Attempt</button>
        </div>
        <div style="display: flex; gap: 12px; margin-top: 12px;">
            <a href="app.html?view=day" class="btn-home" style="margin-top: 0; background: #f8f9fa; color: #1a1a1a; border: 1px solid #ddd; flex: 1;">Back to Topics</a>
            <a href="app.html" class="btn-home" style="margin-top: 0; flex: 1;">Return to Home</a>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const urlParams = new URLSearchParams(window.location.search);
        const attemptId = urlParams.get('attempt_id');
        const isPractice = urlParams.get('practice') === 'true'; // 🟢 Detect Practice Mode
        let currentQuizId = null;

        async function loadResults() {
            if (isPractice) {
                document.getElementById('result-title').innerText = "Practice Complete!";
                document.getElementById('result-subtitle').innerText = "This score was not added to the Weekly Cup.";
                const practiceData = JSON.parse(sessionStorage.getItem('practiceResult'));
                if (practiceData) {
                    currentQuizId = practiceData.quiz_set_id;
                    renderData(practiceData);
                    return;
                }
            }

            if (!attemptId) {
                document.getElementById('loading').innerText = "Error: No attempt ID found.";
                return;
            }

            try {
                const response = await fetch(`https://ez-editorials-bot.onrender.com/api/quiz/result/${attemptId}`);
                const data = await response.json();

                if (data.error) {
                    document.getElementById('loading').innerText = data.error;
                    return;
                }

                currentQuizId = data.quiz_set_id;
                renderData(data);
            } catch (err) {
                document.getElementById('loading').innerText = "Failed to load results.";
            }
        }

        function renderData(data) {
            const s = data.summary;
            document.getElementById('scorecard').innerHTML = `
                <div class="stat-box highlight">
                    <div class="stat-value">${s.score}</div>
                    <div class="stat-label">Total Score</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">${s.rank} / ${s.total_participants}</div>
                    <div class="stat-label">Your Rank</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">${s.percentile}%</div>
                    <div class="stat-label">Percentile</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">${s.accuracy}%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
            `;

            const container = document.getElementById('solutions-container');
            container.innerHTML = '';
            
            data.solutions.forEach((q, index) => {
                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    let className = 'option';
                    let label = '';
                    if (optIndex === q.correct_index) {
                        className += ' correct'; label = ' ✓ Correct';
                    } else if (optIndex === q.user_selected_index) {
                        className += ' wrong'; label = ' ✗ Your Answer';
                    }
                    optionsHtml += `<div class="${className}">${opt}${label}</div>`;
                });

                const expHtml = q.explanation ? `<div class="explanation"><strong>Explanation:</strong> ${q.explanation}</div>` : '';
                container.innerHTML += `
                    <div class="solution-card">
                        <div class="question-text">Q${index + 1}. ${q.text}</div>
                        ${optionsHtml}
                        ${expHtml}
                    </div>
                `;
            });

            document.getElementById('loading').style.display = 'none';
            document.getElementById('result-content').style.display = 'block';
        }

        function triggerReattempt() {
            if(currentQuizId) {
                window.location.href = `test.html?quiz_id=${currentQuizId}&practice=true`;
            }
        }

        function shareResult() {
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
            alert("Sharing feature coming soon!");
        }

        loadResults();
    </script>
</body>
</html>
