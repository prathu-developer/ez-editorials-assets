<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Results</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="haptics.js" defer></script>
    <script src="theme.js" defer></script>
    <style>
        :root {
            --brand: #5a32fa;
            --brand-light: #ece9ff;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-light: #f1f5f9;
            --success: #10b981;
            --danger: #ef4444;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 8px 20px rgba(90, 50, 250, 0.15);
            --app-max-width: 700px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Dark Mode overrides for Result UI */
        body.dark-mode {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-light: #334155;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #e2e8f0; 
            margin: 0; 
            color: var(--text-main); 
            -webkit-tap-highlight-color: transparent;
        }

        .app-shell {
            max-width: var(--app-max-width);
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--bg-body);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-bottom: calc(20px + var(--safe-bottom));
            box-sizing: border-box;
        }

        .header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
        .header h2 { margin: 0 0 6px 0; font-size: 24px; font-weight: 800; color: var(--text-main); }
        .header p { margin: 0; color: var(--text-muted); font-size: 13px; font-weight: 500; }
        
        .scorecard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
        .stat-box { background: var(--bg-card); padding: 16px; border-radius: 16px; text-align: center; box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); }
        .stat-value { font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
        .stat-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* The Hero Stat Box */
        .stat-box.highlight { background: linear-gradient(135deg, #5a32fa, #7c3aed); color: white; border: none; box-shadow: var(--shadow-md); }
        .stat-box.highlight .stat-value { color: white; }
        .stat-box.highlight .stat-label { color: var(--brand-light); }
        
        /* Premium Leaderboard Card (No heavy blur needed!) */
        .leaderboard-card { background: var(--bg-card); border-radius: 20px; margin-bottom: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); overflow: hidden; }
        .lb-title { font-size: 15px; font-weight: 800; padding: 16px 20px; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; background: var(--bg-body); border-bottom: 1px solid var(--border-light); cursor: pointer; }
        
        .lb-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border-light); }
        .lb-row:last-child { border-bottom: none; }
        .lb-left { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 700; color: var(--text-main); }
        .lb-rank { width: 24px; color: var(--text-muted); font-weight: 800; font-size: 14px; }
        .lb-score { font-size: 14px; font-weight: 800; color: var(--brand); }
        .lb-time { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 4px; text-align: right; }
        
        /* Highlight Current User */
        .lb-me { background: var(--brand-light); border: 1px solid #c7d2fe; border-radius: 12px; margin: 8px; padding: 12px; }

        /* Clean Buttons */
        .action-row { display: flex; gap: 12px; margin-top: 24px; }
        .btn-action { flex: 1; padding: 16px; border-radius: 16px; font-size: 14px; font-weight: 700; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; text-decoration: none; box-sizing: border-box; transition: transform 0.1s; }
        .btn-action:active { transform: scale(0.96); }
        
        .btn-primary { background: var(--brand); color: white; box-shadow: var(--shadow-md); }
        .btn-secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-light); box-shadow: var(--shadow-sm); }
        .btn-outline { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
        
        #loading { text-align: center; margin-top: 50px; color: var(--text-muted); font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>
    <div class="app-shell">

    <div id="loading">Calculating Results...</div>

    <div id="result-content" style="display: none;">
        <div class="header">
            <h2 id="result-title">Quiz Complete!</h2>
            <p id="result-subtitle">Here is how you performed.</p>
        </div>

        <div class="scorecard" id="scorecard">
            <!-- Stats injected here -->
        </div>

        <!-- The New Top 10 Block (Foldable) -->
        <div class="leaderboard-card" id="leaderboard-section" style="display: none; padding: 0; overflow: hidden;">
            <div class="lb-title" onclick="toggleLeaderboard()" style="cursor: pointer; padding: 16px; margin: 0; justify-content: space-between; background: #f8f9fa;">
                <span style="display: flex; align-items: center; gap: 8px;">🏆 Top 10 Scholars</span>
                <span id="lb-chevron" style="transition: transform 0.3s; color: #888; font-size: 20px;">⌄</span>
            </div>
            <div id="lb-collapse-wrapper" style="display: none; border-top: 1px solid #f0f0f0; padding: 0 16px 16px 16px;">
                <div id="leaderboard-list"></div>
            </div>
        </div>

        <!-- Actions -->
        <div class="action-row">
            <button class="btn-action btn-outline" onclick="shareResult()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                Share
            </button>
            <button class="btn-action btn-primary" onclick="openReviewMode()">Review Quiz</button>
        </div>
        
        <div class="action-row" style="margin-top: 12px;">
            <a id="btn-back-topics" href="app.html?view=day" class="btn-action btn-secondary">Back to Topics</a>
            <a href="app.html" class="btn-action btn-secondary">Return Home</a>
        </div>
    </div>

    </div> <!-- End of app-shell -->

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const urlParams = new URLSearchParams(window.location.search);
        const attemptId = urlParams.get('attempt_id');
        const isPractice = urlParams.get('practice') === 'true'; // 🟢 Detect Practice Mode
        let currentQuizId = null;

        async function loadResults() {
            if (isPractice) {
                document.getElementById('result-title').innerText = "Practice Complete!";
                document.getElementById('result-subtitle').innerText = "This score was not added to the Weekly Cup.";
                const practiceData = JSON.parse(sessionStorage.getItem('practiceResult'));
                if (practiceData) {
                    currentQuizId = practiceData.quiz_set_id;
                    renderData(practiceData);
                    return;
                }
            }

            if (!attemptId) {
                document.getElementById('loading').innerText = "Error: No attempt ID found.";
                return;
            }

            try {
                // ✨ FIX: Attach Telegram HMAC header to unlock the secured results
                const response = await fetch(`https://ez-editorials-bot.onrender.com/api/quiz/result/${attemptId}`, {
                    headers: { 'X-Telegram-Init-Data': window.Telegram.WebApp.initData }
                });
                const data = await response.json();

                if (data.error) {
                    document.getElementById('loading').innerText = data.error;
                    return;
                }

                currentQuizId = data.quiz_set_id;
                renderData(data);
            } catch (err) {
                document.getElementById('loading').innerText = "Failed to load results.";
            }
        }

        function renderData(data) {
            const s = data.summary;
            document.getElementById('scorecard').innerHTML = `
                <div class="stat-box highlight">
                    <div class="stat-value">${s.score}</div>
                    <div class="stat-label">Total Score</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">${s.rank} / ${s.total_participants}</div>
                    <div class="stat-label">Your Rank</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">${s.percentile}%</div>
                    <div class="stat-label">Percentile</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">${s.accuracy}%</div>
                    <div class="stat-label">Accuracy</div>
                </div>
            `;

            // 🟢 Render Top 10 Leaderboard
            if (data.top_10 && data.top_10.length > 0) {
                const lbList = document.getElementById('leaderboard-list');
                lbList.innerHTML = '';
                
                const currentUserId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
                
                data.top_10.forEach((user, index) => {
                    const m = Math.floor(user.time_taken / 60);
                    const s = user.time_taken % 60;
                    const timeStr = m > 0 ? `${m}m ${s}s` : `${s}s`;
                    
                    let rankDisplay = index + 1;
                    if (rankDisplay === 1) rankDisplay = '🥇';
                    else if (rankDisplay === 2) rankDisplay = '🥈';
                    else if (rankDisplay === 3) rankDisplay = '🥉';
                    else rankDisplay = `#${rankDisplay}`;

                    const isMe = user.user_id == currentUserId;
                    const rowClass = isMe ? 'lb-row lb-me' : 'lb-row';
                    const nameDisplay = isMe ? 'You' : user.name;

                    lbList.innerHTML += `
                        <div class="${rowClass}">
                            <div class="lb-left">
                                <span class="lb-rank">${rankDisplay}</span>
                                <span>${nameDisplay}</span>
                            </div>
                            <div class="lb-right">
                                <div class="lb-score">${user.score} pts</div>
                                <div class="lb-time">⏱ ${timeStr}</div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('leaderboard-section').style.display = 'block';
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('result-content').style.display = 'block';
        }

        // 🟢 NEW: Router function that pushes the user to the Review Engine
        function openReviewMode() {
            const dayParam = urlParams.get('day');
            const dayQuery = dayParam !== null ? `&day=${dayParam}` : '';
            
            if (isPractice) {
                window.location.href = `test.html?practice=true&mode=review${dayQuery}`;
            } else {
                window.location.href = `test.html?attempt_id=${attemptId}&mode=review${dayQuery}`;
            }
        }

        function triggerReattempt() {
            if(currentQuizId) {
                const dayParamStr = urlParams.get('day');
                const dayQuery = dayParamStr !== null ? `&day=${dayParamStr}` : '';
                window.location.href = `test.html?quiz_id=${currentQuizId}&practice=true${dayQuery}`;
            }
        }

        function shareResult() {
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
            alert("Sharing feature coming soon!");
        }

        const dayParamStr = urlParams.get('day');
        if (dayParamStr !== null) {
            document.getElementById('btn-back-topics').href = `app.html?view=day&day=${dayParamStr}`;
        }

        // 🟢 Accordion Logic for the Leaderboard
        function toggleLeaderboard() {
            // Trigger a soft vibration when tapped
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
            
            const wrapper = document.getElementById('lb-collapse-wrapper');
            const chevron = document.getElementById('lb-chevron');
            
            if (wrapper.style.display === 'none') {
                wrapper.style.display = 'block';
                chevron.style.transform = 'rotate(180deg)'; // Flip arrow up
            } else {
                wrapper.style.display = 'none';
                chevron.style.transform = 'rotate(0deg)'; // Flip arrow down
            }
        }
        loadResults();
    </script>
</body>
</html>
